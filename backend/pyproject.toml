[project]
name = "automunki"
version = "0.1.0"
description = "Munki Manager — Munki and AutoPkg web management platform"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi-users[sqlalchemy]>=13.0.0",
    "httpx>=0.27.0",
    "structlog>=24.0.0",
    "boto3>=1.35.0",
    "python-multipart>=0.0.9",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "pyyaml>=6.0.0",
    "argon2-cffi>=23.1.0",
    "croniter>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]
# Install with `uv pip install -e ".[azure]"` to enable the Azure Blob storage
# backend (storage_backend=azure_blob). See docs/storage-backends.md.
#
# ``aiohttp`` is required by azure-core's default async transport
# (``AioHttpTransport``), which is what ``azure-storage-blob.aio`` and
# ``azure-identity.aio`` use under the hood. Without it any async upload or
# credential acquisition raises ``ImportError("aiohttp package is not installed")``.
azure = [
    "azure-storage-blob>=12.20.0",
    "azure-identity>=1.17.0",
    "aiohttp>=3.9.0",
]

[project.scripts]
automunki = "automunki.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["automunki"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
