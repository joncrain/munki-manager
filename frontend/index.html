<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overview | Dashboard</title>
    <meta name="description" content="Munki and AutoPkg web management platform" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script>
      var k = 'munki-manager-color-palette'
      var leg = 'automunki-color-palette'
      var p
      try {
        p = localStorage.getItem(k) || localStorage.getItem(leg)
        if (
          p === 'monokai' ||
          p === 'one-dark' ||
          p === 'catppuccin'
        ) {
          document.documentElement.setAttribute('data-palette', p)
        }
      } catch {
        /* storage unavailable */
      }
    </script>
  </head>
  <body class="antialiased" style="font-family: 'Geist', sans-serif; --font-geist-sans: 'Geist', sans-serif; --font-geist-mono: 'Geist Mono', monospace;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
