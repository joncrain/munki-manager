name: AutoPkg Cloud Runner

on:
  workflow_dispatch:
    inputs:
      recipe:
        description: Comma-separated recipe names to run (e.g. "GoogleChrome, Firefox"). Leave empty for all.
        required: false
      run_id:
        description: Munki Manager run ID for API reporting
        required: false
      api_url:
        description: Munki Manager API URL
        required: false

env:
  BACKEND_URL: ${{ inputs.api_url }}
  # Bearer token shared with the Munki Manager API's LOCAL_RUNNER_TOKEN.
  # Required for every API call below — without it the API returns 401 on the
  # AutoPkg ingest endpoints (formerly unauthenticated, now Bearer-gated).
  # Set MUNKI_MANAGER_RUNNER_TOKEN as a GitHub Actions secret on this repo.
  AUTOMUNKI_API_TOKEN: ${{ secrets.MUNKI_MANAGER_RUNNER_TOKEN }}

permissions:
  contents: read

jobs:
  autopkg-run:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      MUNKI_VERSION: 7.0.10
      MUNKI_EXPLICIT_VERSION: 7.0.10.5496
      AUTOPKG_VERSION: 2.9.0
    steps:
      - name: Checkout repository
        # Default fetch-depth=1; the runner only needs the AutoPkg/scripts
        # tree at HEAD (no git log / blame / archive operations downstream).
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"
          enable-cache: true

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Register GitHub run with Munki Manager API
        if: github.event.inputs.run_id != '' && github.event.inputs.api_url != ''
        env:
          API_BASE_URL: ${{ env.BACKEND_URL }}
          RUN_ID: ${{ github.event.inputs.run_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "${AUTOMUNKI_API_TOKEN:-}" ]; then
            echo "::error::MUNKI_MANAGER_RUNNER_TOKEN secret is not set; the API will reject the runner with 401."
            exit 1
          fi
          GITHUB_RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sf -X POST "${API_BASE_URL}/api/v1/autopkg/runs/${RUN_ID}/github-context" \
            -H "Authorization: Bearer ${AUTOMUNKI_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"github_run_id\":\"${GITHUB_RUN_ID}\",\"github_run_url\":\"${GITHUB_RUN_URL}\"}"

      - name: Install AutoPkg
        uses: joncrain/macos-pkg-install@7134d2a14cf37a88794d794ea0281e1e84161a51 # v1.0
        with:
          pkg_url: https://github.com/autopkg/autopkg/releases/download/v${{ env.AUTOPKG_VERSION }}/autopkg-${{ env.AUTOPKG_VERSION }}.pkg

      - name: Install Munki
        uses: joncrain/macos-pkg-install@7134d2a14cf37a88794d794ea0281e1e84161a51 # v1.0
        with:
          pkg_url: https://github.com/munki/munki/releases/download/v${{ env.MUNKI_VERSION }}/munkitools-${{ env.MUNKI_EXPLICIT_VERSION }}.pkg

      - name: Configure AutoPkg
        run: |
          defaults write com.github.autopkg CACHE_DIR "${GITHUB_WORKSPACE}/AutoPkg/Cache"
          defaults write com.github.autopkg RECIPE_OVERRIDE_DIRS "${GITHUB_WORKSPACE}/AutoPkg/Overrides/"
          defaults write com.github.autopkg RECIPE_REPO_DIR "${GITHUB_WORKSPACE}/AutoPkg/repos/"
          defaults write com.github.autopkg FAIL_RECIPES_WITHOUT_TRUST_INFO -bool TRUE
          defaults write com.github.autopkg MUNKI_REPO "${GITHUB_WORKSPACE}"
          defaults write com.github.autopkg GITHUB_TOKEN "${{ secrets.GITHUB_TOKEN }}"
          mkdir -p ./pkgs/
          mkdir -p /Users/runner/Library/AutoPkg/

      - name: Load metadata cache from API
        run: |
          API_BASE="${BACKEND_URL}/api/v1/autopkg"
          echo "Fetching metadata cache from ${API_BASE}/metadata-cache"
          HTTP_CODE=$(curl -s -H "Authorization: Bearer ${AUTOMUNKI_API_TOKEN}" \
            -o metadata_cache_response.json -w "%{http_code}" "${API_BASE}/metadata-cache")
          if [ "$HTTP_CODE" = "200" ]; then
            python3 AutoPkg/scripts/load_metadata_cache.py
          elif [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
            echo "::error::metadata-cache returned HTTP ${HTTP_CODE} — MUNKI_MANAGER_RUNNER_TOKEN does not match the server's LOCAL_RUNNER_TOKEN."
            exit 1
          else
            echo "No metadata cache found (HTTP ${HTTP_CODE}), starting fresh"
            echo '{}' > metadata_cache.json
          fi

      - name: Fetch run config from API
        id: run_config
        if: github.event.inputs.api_url != ''
        env:
          RECIPE_INPUT: ${{ github.event.inputs.recipe }}
        run: |
          API_BASE="${BACKEND_URL}/api/v1/autopkg"
          QUERY_PARAMS=""
          if [ -n "$RECIPE_INPUT" ]; then
            QUERY_PARAMS="?recipes=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$RECIPE_INPUT'))")"
          fi

          echo "Fetching run config from ${API_BASE}/runs/config${QUERY_PARAMS}"
          curl -sf -H "Authorization: Bearer ${AUTOMUNKI_API_TOKEN}" \
            "${API_BASE}/runs/config${QUERY_PARAMS}" -o run_config.json

          echo "Run config:"
          cat run_config.json | python3 -m json.tool

          echo "has_config=true" >> "$GITHUB_OUTPUT"

      - name: Write override files and repo list from API config
        if: steps.run_config.outputs.has_config == 'true'
        run: python3 AutoPkg/scripts/write_overrides.py

      - name: Add AutoPkg repos
        # ``repo-add`` does a fresh ``git clone`` into RECIPE_REPO_DIR on the
        # hosted runner. We deliberately skip a follow-up ``repo-update`` here
        # — the runner is ephemeral, every repo we just cloned is already at
        # the latest commit, and ``repo-update`` round-trips ~1-2s per repo
        # for no functional benefit. (The local Mac script keeps the update
        # step because long-lived Macs accumulate stale repos.)
        run: |
          REPO_FILE="AutoPkg/run_repo_list.txt"
          cat "$REPO_FILE" | xargs -L1 autopkg repo-add

      - name: Ensure parent recipe repos
        # Server-side ``run_repo_list.txt`` is built from each recipe's stored
        # ``trust_info`` (parent recipes + non-core processors). When trust info
        # is incomplete (older imports, identifier resolution failures during
        # compute_trust_info, upstream chain deepening since last verify), the
        # runner ends up without a repo that contains a needed grandparent or
        # third-party processor (e.g. grahampugh-recipes for ChangeModeOwner)
        # and AutoPkg crashes with "Could not find parent recipe" or "processor
        # path not found … Failed local trust verification". This script walks
        # every override's on-disk parent chain and Process steps and
        # ``autopkg repo-add``s the inferred repo for any unresolved ancestor
        # or processor namespace. No-op when everything already resolves on
        # disk. We use ``uv run --with pyyaml`` so ``.recipe.yaml`` files parse
        # correctly without mutating the runner's system Python; if ``uv`` is
        # unavailable the script falls back to plist-only parsing (rare
        # yaml-recipe case).
        run: |
          uv run --no-project --with pyyaml python3 AutoPkg/scripts/ensure_parent_repos.py \
            || python3 AutoPkg/scripts/ensure_parent_repos.py

      - name: Sync AutoPkg preferences to disk
        # cloud-autopkg-runner spawns subprocesses that re-read the
        # com.github.autopkg domain; this `defaults read` flushes our
        # earlier writes (CACHE_DIR, RECIPE_OVERRIDE_DIRS, RECIPE_SEARCH_DIRS
        # set by repo-add) so they're visible immediately. No diagnostic
        # output: it just adds noise to the run summary.
        run: defaults read com.github.autopkg > /dev/null 2>&1 || true

      - name: Run cloud-autopkg-runner
        run: |
          uvx 'cloud-autopkg-runner' -v \
            --recipe-list AutoPkg/run_recipe_list.json \
            --cache-file metadata_cache.json \
            --cache-plugin json \
            --log-file autopkg_runner.log \
            --report-dir AutoPkg/Reports/

      - name: Save metadata cache to API
        if: always()
        env:
          API_BASE_URL: ${{ env.BACKEND_URL }}
        run: |
          if [ ! -f metadata_cache.json ]; then
            echo "No metadata cache file found, skipping"
            exit 0
          fi
          python3 AutoPkg/scripts/save_metadata_cache.py

      - name: Report results and ingest pkginfo
        if: always() && github.event.inputs.run_id != '' && github.event.inputs.api_url != ''
        env:
          API_BASE_URL: ${{ env.BACKEND_URL }}
          RUN_ID: ${{ github.event.inputs.run_id }}
        run: |
          REPORT_DIR="AutoPkg/Reports"
          PKGSINFO_DIR="${GITHUB_WORKSPACE}/pkgsinfo"

          # report_results.py reads AUTOMUNKI_API_TOKEN from the env (already
          # exported by the workflow-level env block) and forwards it as the
          # Bearer header on every API call.
          if [ ! -d "$REPORT_DIR" ] || [ -z "$(ls -A "$REPORT_DIR" 2>/dev/null)" ]; then
            echo "No report files found, marking run complete"
            curl -sf -X POST "${API_BASE_URL}/api/v1/autopkg/runs/${RUN_ID}/complete" \
              -H "Authorization: Bearer ${AUTOMUNKI_API_TOKEN}" \
              -H "Content-Type: application/json" -d '{}'
            exit 0
          fi

          for report in "$REPORT_DIR"/*.plist; do
            [ -f "$report" ] || continue
            echo "Processing report: $report"
            REPORT_FILE="$report" PKGSINFO_DIR="$PKGSINFO_DIR" python3 AutoPkg/scripts/report_results.py
          done

          echo "Marking run complete"
          curl -sf -X POST "${API_BASE_URL}/api/v1/autopkg/runs/${RUN_ID}/complete" \
            -H "Authorization: Bearer ${AUTOMUNKI_API_TOKEN}" \
            -H "Content-Type: application/json" -d '{}'

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autopkg-run-artifacts
          path: |
            AutoPkg/Cache/**/*receipt*
            AutoPkg/Reports/*
            autopkg_runner.log
            metadata_cache.json
